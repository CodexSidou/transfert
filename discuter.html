<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">

<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).then(()=>window.caches?caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))):null)}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;transition:box-shadow .2s}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#312e81 0%,#0f172a 45%,#020617 100%);color:#e2e8f0;padding:0 16px 60px;display:flex;flex-direction:column;align-items:center}
#navbar{position:sticky;top:0;z-index:10;width:100%;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(148,163,184,.2);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;margin:0 -16px 24px}
#navbar .logo{color:#e2e8f0;font-weight:800;font-size:18px}
#navbar .logo b{color:#a5b4fc}
#navbar .tabs{display:flex;gap:6px}
#navbar .tabs a{text-decoration:none;color:#a5b4fc;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
#navbar .tabs a.active{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#0f172a}
#navbar .actions button{width:36px;height:36px;border-radius:50%;padding:0;margin-inline-start:4px}
#menuBtn{display:none}
@media (max-width:700px){
  #menuBtn{display:flex !important;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center}
  #navbar .tabs{position:fixed;top:58px;left:0;right:0;max-height:0;overflow:hidden;flex-direction:column;background:rgba(15,23,42,.98);padding:0 10px;gap:0;transition:max-height .3s ease,padding .3s ease;display:flex;border-bottom:0;z-index:99}
  #navbar .tabs.open{max-height:320px;padding:10px;gap:4px;border-bottom:1px solid rgba(148,163,184,.2)}
  #navbar .tabs a{padding:13px;text-align:center;border-radius:10px;display:block}
  body{padding:0 8px 50px}
  #navbar{padding:10px 12px;margin:0 -8px 16px}
  .card{padding:18px}
  button{padding:13px 18px;font-size:15px}
}
.card{background:rgba(30,41,59,.6);backdrop-filter:blur(10px);border:1px solid rgba(148,163,184,.2);border-radius:20px;padding:26px;width:100%;max-width:640px;margin-bottom:18px}
.card h2{color:#c4b5fd;font-size:16px;margin-bottom:14px;text-transform:uppercase;letter-spacing:3px}
button{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#0f172a;font-weight:800;border:none;padding:11px 20px;border-radius:11px;cursor:pointer;font-size:14px;margin:4px 2px}
button.ghost{background:transparent;color:#a5b4fc;border:1px solid #6366f1}
.langpill{background:linear-gradient(135deg,#38bdf8,#818cf8,#a78bfa);color:#0f172a;font-weight:800;padding:8px 14px !important;border-radius:999px;border:none;box-shadow:0 4px 14px rgba(129,140,248,.5);font-size:12px;cursor:pointer}
input[type=text],input[type=password]{padding:11px 14px;border-radius:11px;border:1px solid #4f46e5;background:rgba(0,0,0,.3);color:#fff;width:100%;max-width:240px;font-size:16px}
.box{background:rgba(0,0,0,.3);border-radius:12px;padding:12px 14px;min-height:120px;max-height:320px;overflow-y:auto;font-size:13px;white-space:pre-wrap;margin:10px 0;color:#c7d2fe;scrollbar-width:thin;scrollbar-color:#818cf8 rgba(0,0,0,.2)}
input[type=file]{margin:6px 0;color:#94a3b8;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header{text-align:center;margin-bottom:24px}
header h1{font-size:36px;font-weight:800}
header h1 b{color:#a5b4fc}
header p{color:#94a3b8;margin-top:8px}
#chat img{max-width:100%;max-height:240px;border-radius:10px;margin-top:4px}
#code{font-size:36px;letter-spacing:8px;font-family:Consolas,monospace;color:#a5b4fc;border:2px dashed #818cf8;border-radius:14px;padding:10px 20px;display:inline-block;margin:10px 0;direction:ltr}
</style>
</head>
<body>
<div id="navbar">
  <div class="logo">📦 Send<b>Your File</b></div>
  <div class="tabs" id="navTabs">
    <a href="index.html">📤 <span data-ar="إرسال" data-fr="Envoyer" data-en="Send">إرسال</span></a>
    <a href="recevoir.html">📥 <span data-ar="استقبال" data-fr="Recevoir" data-en="Receive">استقبال</span></a>
    <a href="discuter.html" class="active">💬 <span data-ar="دردشة" data-fr="Chat" data-en="Chat">دردشة</span></a>
    <a href="guide.html">📖 <span>Guide</span></a>
  </div>
  <div class="actions">
    <button id="menuBtn" class="ghost" onclick="document.getElementById('navTabs').classList.toggle('open')">☰</button>
    <button id="langBtn" class="langpill">🌐 FR</button>
  </div>
</div>
<header>
  <h1 data-ar="دردشة مشفّرة" data-fr="Chat chiffré" data-en="Encrypted chat">💬 دردشة مشفّرة</h1>
  <p data-ar="رمز خاص بالدردشة — فقط الشخص صاحب الرمز يستطيع رؤية الرسائل والصور." data-fr="Un code spécial — seule la personne qui a le code peut lire les messages et photos." data-en="A code — only the person with the code can read messages and photos.">رمز خاص بالدردشة — فقط الشخص صاحب الرمز يستطيع رؤية الرسائل والصور.</p>
</header>

<div class="card">
  <button id="btnCreate" data-ar="✨ إنشاء رمز دردشة" data-fr="✨ Créer un code de chat" data-en="✨ Create a chat code">✨ إنشاء رمز دردشة</button>
  <div id="createArea" style="display:none">
    <div id="code"></div>
    <p style="color:#94a3b8" data-ar="أعطِ هذا الرمز لصديقك ليدخله عند الاستقبال." data-fr="Donne ce code à la personne pour qu'elle rejoigne." data-en="Give this code to the person to join.">أعطِ هذا الرمز لصديقك ليدخله عند الاستقبال.</p>
  </div>
  <div class="row" style="margin-top:14px;border-top:1px solid rgba(148,163,184,.2);padding-top:14px">
    <input type="text" id="codeInput" data-ar="أدخل رمز الدردشة" data-fr="Code de chat" data-en="Chat code" placeholder="أدخل رمز الدردشة">
    <button id="btnJoin" data-ar="🔗 ربط" data-fr="🔗 Rejoindre" data-en="🔗 Join">🔗 ربط</button>
  </div>
  <p class="note" style="font-size:12px;color:#94a3b8;margin-top:10px" data-ar="🔒 الرسائل مشفّرة (AES-GCM) ولا تُحفظ." data-fr="🔒 Les messages sont chiffrés (AES-GCM) et non sauvegardés." data-en="🔒 Messages are encrypted (AES-GCM) and not saved.">🔒 الرسائل مشفّرة (AES-GCM) ولا تُحفظ.</p>
</div>

<div class="card" id="chatCard" style="display:none">
  <div class="box" id="chat"></div>
  <div class="row">
    <input type="text" id="chatInput" data-ar="رسالة…" data-fr="Message…" data-en="Message…" placeholder="رسالة…" style="flex:1;max-width:none">
    <input type="file" id="photo" accept="image/*" style="display:none">
    <button id="photoBtn" class="ghost">📷</button>
    <button id="chatBtn" data-ar="إرسال" data-fr="Envoyer" data-en="Send">إرسال</button>
  </div>
</div>

<div class="card">
  <h2 data-ar="📋 السجل التقني" data-fr="📋 Journal technique" data-en="📋 Technical log">📋 السجل التقني</h2>
  <div id="log" class="box" style="max-height:220px;min-height:90px"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let LANG=(typeof localStorage!=='undefined'&&localStorage.getItem('sg_lang'))||'ar'; const EN_FR={"Envoyer":"Send","Recevoir":"Receive","Chat":"Chat","Dossiers, images, ZIP, RAR… entre 2 appareils — sans serveur.":"Folders, images, ZIP, RAR… between 2 devices — no server.","📱 Fonctionne sur PC ou téléphone — PC ↔ PC, PC ↔ téléphone, téléphone ↔ PC.":"📱 Works on PC or phone — PC ↔ PC, PC ↔ phone, phone ↔ PC.","🔴 Hors ligne":"🔴 Offline","1 · Envoyer":"1 · Send","✨ Créer un code":"✨ Create a code","Mot de passe (optionnel)":"Password (optional)","📋 Copier":"📋 Copy","🔗 Lien":"🔗 Link","Fichiers (clique ou glisse):":"Files (click or drag):","📂 Clique ou glisse des fichiers/photos ici":"📂 Click or drop files/photos here","📁 Dossier":"📁 Folder","📄 Fichiers":"📄 Files","📷 Photos":"📷 Photos","📤 Envoyer les fichiers":"📤 Send files","🕓 Historique":"🕓 History","🗑️ Vider l'historique":"🗑️ Clear history","📋 Journal technique":"📋 Technical log","Saisis le code donné par l'expéditeur.":"Enter the code given by the sender.","Code reçu":"Code received","🔗 Connecter":"🔗 Connect","Mot de passe":"Password","Chat chiffré":"Encrypted chat","Un code spécial — seule la personne qui a le code peut lire les messages et photos.":"A code — only the person with the code can read messages and photos.","✨ Créer un code de chat":"✨ Create a chat code","Donne ce code à la personne pour qu'elle rejoigne.":"Give this code to the person to join.","Code de chat":"Chat code","🔗 Rejoindre":"🔗 Join","🔒 Les messages sont chiffrés (AES-GCM) et non sauvegardés.":"🔒 Messages are encrypted (AES-GCM) and not saved.","Message…":"Message…","1 · إرسال الملفات":"1 · Send files","2 · استقبال":"2 · Receive","ساعة السجل":"History","تم الاستلام: ":"Received: ","تم إرسال: ":"Sent: "};const t=(a,f)=>LANG==='ar'?a:(LANG==='fr'?f:(EN_FR[f]||f));
const log=m=>document.getElementById('log').textContent+=m+"\n";
const rand=()=>String(Math.floor(10000+Math.random()*90000));
let conn=null, chatKey=null, imgBuf=null;
function applyLang(l){LANG=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.title=l==='ar'?'Send Your File — دردشة':'Send Your File — Chat';document.querySelectorAll('[data-ar]').forEach(el=>{const v=l==='en'?(el.dataset.en||el.dataset.fr):el.dataset[l];if(!v)return;if(el.placeholder!==undefined&&el.tagName==='INPUT')el.placeholder=v;else el.textContent=v;});document.getElementById('langBtn').textContent=l==='ar'?'🌐 العربية':(l==='fr'?'🌐 Français':'🌐 English');try{localStorage.setItem('sg_lang',l)}catch(e){}}
document.getElementById('langBtn').onclick=()=>applyLang(LANG==='ar'?'fr':(LANG==='fr'?'en':'ar'));async function keyFrom(code){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sendcode:'+code));return crypto.subtle.importKey('raw',h,'AES-GCM',false,['encrypt','decrypt'])}
async function enc(x){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},chatKey,new TextEncoder().encode(x));return btoa(String.fromCharCode(...iv))+':'+btoa(String.fromCharCode(...new Uint8Array(ct)))}
async function dec(s){const[i,c]=s.split(':');const u=x=>new Uint8Array(atob(x).split('').map(ch=>ch.charCodeAt(0)));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(i)},chatKey,u(c));return new TextDecoder().decode(pt)}
const say=(who,x)=>document.getElementById('chat').textContent+=who+' : '+x+'\n';
const showChat=async code=>{document.getElementById('chatCard').style.display='block';chatKey=await keyFrom(code)};
document.getElementById('btnCreate').onclick=()=>{const code=rand();const peer=new Peer(code,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:numb.viagenie.ca',username:'webrtc@live.com',credential:'muazkh'},{urls:'turn:numb.viagenie.ca:443?transport=tcp',username:'webrtc@live.com',credential:'muazkh'}]}});peer.on('open',()=>{document.getElementById('createArea').style.display='block';document.getElementById('code').textContent=code;log('🔑 '+t('رمز الدردشة: ','Code de chat: ')+code)});peer.on('connection',c=>{conn=c;showChat(code);c.on('data',onMsg);c.on('open',()=>log('✅ '+t('صديقك متصل!','Connecté !')))});peer.on('error',e=>log('❌ '+e.type))};
document.getElementById('btnJoin').onclick=()=>{const code=document.getElementById('codeInput').value.trim();if(!code){log('⚠️ '+t('أدخل الرمز','Entre le code'));return}const peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:numb.viagenie.ca',username:'webrtc@live.com',credential:'muazkh'},{urls:'turn:numb.viagenie.ca:443?transport=tcp',username:'webrtc@live.com',credential:'muazkh'}]}});peer.on('open',async()=>{const c=peer.connect(code,{serialization:'binary'});conn=c;await showChat(code);c.on('open',()=>log('🔗 '+t('متصل بالدردشة','Connecté au chat')));c.on('data',onMsg)});peer.on('error',e=>log('❌ '+e.type+' ('+t('رمز غير صالح؟','code inconnu ?')+')'))};
async function onMsg(m){if(m.type==='chat'){try{say('👤 '+t('هم','Eux'),await dec(m.data))}catch{log('⚠️ '+t('رسالة غير مقروءة','message illisible'))}}if(m.type==='imgmeta'){window._img={name:m.name,mime:m.mime,parts:[]}}if(m.type==='imgchunk'&&window._img)window._img.parts.push(m.data);if(m.type==='imgend'&&window._img){const blob=new Blob(window._img.parts,{type:window._img.mime});const im=document.createElement('img');im.src=URL.createObjectURL(blob);im.style.cursor='pointer';im.onclick=()=>window.open(im.src,'_blank');document.getElementById('chat').appendChild(im);document.getElementById('chat').appendChild(document.createTextNode('\n'));window._img=null}}
document.getElementById('photoBtn').onclick=()=>document.getElementById('photo').click();
document.getElementById('photo').onchange=async e=>{const f=e.target.files[0];if(!f||!conn||!conn.open){log('⚠️ '+t('لست متصلا بعد','Pas encore connecté'));return}conn.send({type:'imgmeta',name:f.name,mime:f.type});const buf=await f.arrayBuffer();const CH=16*1024;for(let off=0;off<buf.byteLength;off+=CH)conn.send({type:'imgchunk',data:buf.slice(off,off+CH)});conn.send({type:'imgend'});const im=document.createElement('img');im.src=URL.createObjectURL(f);im.style.cursor='pointer';im.onclick=()=>window.open(im.src,'_blank');document.getElementById('chat').appendChild(im);document.getElementById('chat').appendChild(document.createTextNode('\n'))};
document.getElementById('chatBtn').onclick=async()=>{const txt=document.getElementById('chatInput').value.trim();if(!conn||!conn.open){log('⚠️ '+t('انتظر... الاتصال غير مفتوح بعد','En attente d\'ouverture de la connexion…'));return}if(txt&&chatKey){conn.send({type:'chat',data:await enc(txt)});say('🧑 '+t('أنا','Moi'),txt)}document.getElementById('chatInput').value=''};
applyLang(LANG);
</script>
<footer style="margin-top:40px;color:#64748b;font-size:13px;text-align:center">BY Sidou</footer>
</body>
</html>
