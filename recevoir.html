<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send Your File — استقبال</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="icon.svg">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).then(()=>window.caches?caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))):null)}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;transition:box-shadow .2s}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#312e81 0%,#0f172a 45%,#020617 100%);color:#e2e8f0;padding:0 16px 60px;display:flex;flex-direction:column;align-items:center}
body.light{background:radial-gradient(1200px 600px at 80% -10%,#c7d2fe 0%,#eef2ff 50%,#fff 100%);color:#1e293b}
#navbar{position:sticky;top:0;z-index:10;width:100%;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(148,163,184,.2);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;margin:0 -16px 24px}
#navbar .logo{color:#e2e8f0;font-weight:800;font-size:18px}
#navbar .logo b{color:#a5b4fc}
#navbar .tabs{display:flex;gap:6px}
#navbar .tabs a{text-decoration:none;color:#a5b4fc;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
#navbar .tabs a.active{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#0f172a}
#navbar .actions button{width:36px;height:36px;border-radius:50%;padding:0;margin-inline-start:4px}
#menuBtn{display:none}
@media (max-width:700px){
  #menuBtn{display:flex !important;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center}
  #navbar .tabs{position:fixed;top:58px;left:0;right:0;max-height:0;overflow:hidden;flex-direction:column;background:rgba(15,23,42,.98);padding:0 10px;gap:0;transition:max-height .3s ease,padding .3s ease;display:flex;border-bottom:0;z-index:99}
  #navbar .tabs.open{max-height:320px;padding:10px;gap:4px;border-bottom:1px solid rgba(148,163,184,.2)}
  #navbar .tabs a{padding:13px;text-align:center;border-radius:10px;display:block}
  body{padding:0 8px 50px}
  #navbar{padding:10px 12px;margin:0 -8px 16px}
  .card{padding:18px}
  button{padding:13px 18px;font-size:15px}
}
.card{background:rgba(30,41,59,.6);backdrop-filter:blur(10px);border:1px solid rgba(148,163,184,.2);border-radius:20px;padding:26px;width:100%;max-width:640px;margin-bottom:18px}
body.light .card{background:#fff;border-color:#e2e8f0}
.card h2{color:#c4b5fd;font-size:16px;margin-bottom:14px;text-transform:uppercase;letter-spacing:3px}
button{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#0f172a;font-weight:800;border:none;padding:11px 20px;border-radius:11px;cursor:pointer;font-size:14px;margin:4px 2px}
button.ghost{background:transparent;color:#a5b4fc;border:1px solid #6366f1}
input[type=text],input[type=password]{padding:11px 14px;border-radius:11px;border:1px solid #4f46e5;background:rgba(0,0,0,.3);color:#fff;width:100%;max-width:240px;font-size:16px}
body.light input[type=text],body.light input[type=password]{background:#f8fafc;color:#0f172a;border-color:#c7d2fe}
.speed{font-family:Consolas,monospace;color:#c4b5fd;margin-top:8px;font-size:14px;direction:ltr}
.box{background:rgba(0,0,0,.3);border-radius:12px;padding:12px 14px;min-height:56px;max-height:170px;overflow-y:auto;font-size:13px;white-space:pre-wrap;margin:10px 0;color:#c7d2fe;scrollbar-width:thin;scrollbar-color:#818cf8 rgba(0,0,0,.2)}
#files a{display:block;color:#c4b5fd;background:rgba(0,0,0,.3);padding:9px 12px;border-radius:9px;margin-top:6px;text-decoration:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header{text-align:center;margin-bottom:24px}
header h1{font-size:36px;font-weight:800}
header h1 b{color:#a5b4fc}
header p{color:#94a3b8;margin-top:8px}
</style>
</head>
<body>
<div id="navbar">
  <div class="logo">📦 Send<b>Your File</b></div>
  <div class="tabs" id="navTabs">
    <a href="index.html">📤 <span data-ar="إرسال" data-fr="Envoyer">إرسال</span></a>
    <a href="recevoir.html" class="active">📥 <span data-ar="استقبال" data-fr="Recevoir">استقبال</span></a>
    <a href="discuter.html">💬 <span data-ar="دردشة" data-fr="Chat">دردشة</span></a>
  </div>
  <div class="actions">
    <button id="menuBtn" class="ghost" onclick="document.getElementById('navTabs').classList.toggle('open')">☰</button>
    <button id="langBtn" class="ghost">FR</button>
    <button id="themeBtn" class="ghost">🌓</button>
  </div>
</div>
<header>
  <h1 data-ar="استقبال الملفات" data-fr="Recevoir">📥 استقبال الملفات</h1>
  <p data-ar="أدخل الرمز الذي أعطاك إياه المُرسِل." data-fr="Saisis le code donné par l'expéditeur.">أدخل الرمز الذي أعطاك إياه المُرسِل.</p>
</header>
<div id="statusConn" class="box" style="text-align:center;max-width:300px;margin-bottom:18px" data-ar="🔴 غير متصل" data-fr="🔴 Hors ligne">🔴 غير متصل</div>
<div class="card">
  <div class="row">
    <input type="text" id="codeInput" data-ar="الرمز المستلَم" data-fr="Code reçu" placeholder="الرمز المستلَم">
    <button id="btnReceiver" data-ar="🔗 اتصال" data-fr="🔗 Connecter">🔗 اتصال</button>
    <input type="password" id="passRecv" data-ar="كلمة المرور" data-fr="Mot de passe" placeholder="كلمة المرور" style="max-width:140px">
  </div>
  <div id="files"></div>
  <div id="recvSpeed" class="speed hidden"></div>
</div>
<div class="card">
  <h2 data-ar="📋 السجل التقني" data-fr="📋 Journal technique">📋 السجل التقني</h2>
  <div id="log" class="box" style="max-height:220px;min-height:90px"></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let LANG='ar'; const t=(a,f)=>LANG==='ar'?a:f;
const log=m=>document.getElementById('log').textContent+=m+"\n";
function applyLang(l){LANG=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.title=l==='ar'?'Send Your File — استقبال':'Send Your File — Recevoir';document.querySelectorAll('[data-ar]').forEach(el=>{const v=el.dataset[l];if(!v)return;if(el.placeholder!==undefined&&el.tagName==='INPUT')el.placeholder=v;else el.textContent=v;});document.getElementById('langBtn').textContent=l==='ar'?'FR':'العربية'}
document.getElementById('langBtn').onclick=()=>applyLang(LANG==='ar'?'fr':'ar');
document.getElementById('themeBtn').onclick=()=>document.body.classList.toggle('light');
const setStatus=x=>document.getElementById('statusConn').textContent=x;
function startPing(conn){const s=()=>{try{conn.send({type:'ping',t:Date.now()})}catch{}};s();const iv=setInterval(s,3000);conn.on('data',m=>{if(m.type==='ping')conn.send({type:'pong',t:m.t});else if(m.type==='pong')setStatus('🟢 '+t('متصل','Connecté')+' — '+(Date.now()-m.t)+' ms')});conn.on('close',()=>{clearInterval(iv);setStatus('🔴 '+t('غير متصل','Hors ligne'))})}
const urlCode=new URLSearchParams(location.search).get('code');
if(urlCode){document.getElementById('codeInput').value=urlCode;setTimeout(()=>connectRecv(urlCode),800)}
let recvConn=null;
function connectRecv(code){const peer=new Peer();let cur=null,last=0,lastT=Date.now();document.getElementById('recvSpeed').classList.remove('hidden');peer.on('open',()=>{const conn=peer.connect(code,{serialization:'binary'});recvConn=conn;let gotFirst=false;conn.on('open',()=>{setStatus('🟡 '+t('جارٍ الاتصال…','En connexion…'));log('🔗 '+t('متصل بالرمز ','Connecté à ')+code);startPing(conn);const iv=setInterval(()=>{if(!gotFirst)conn.send({type:'ready',pass:document.getElementById('passRecv').value||''});},800);conn.send({type:'ready',pass:document.getElementById('passRecv').value||''});lastT=Date.now();window._stopReady=()=>{gotFirst=true;clearInterval(iv)}});conn.on('data',async msg=>{if(msg.type==='meta'){cur={name:msg.name,parts:[],mime:msg.mime||''};log('📥 '+msg.name);last=0;if(window._stopReady)window._stopReady()}else if(msg.type==='chunk'&&cur){cur.parts.push(msg.data);const now=Date.now();const got=cur.parts.reduce((s,p)=>s+p.byteLength,0);if(now-lastT>500){const v=(got-last)/((now-lastT)/1000);document.getElementById('recvSpeed').textContent='⚡ '+(v/1048576).toFixed(2)+' MB/s';last=got;lastT=now}}else if(msg.type==='fileend'&&cur){const blob=new Blob(cur.parts,{type:cur.mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=cur.name.split('/').pop();a.textContent=(blob.type.startsWith('image/')?'🖼️ ':'📥 ')+cur.name+' — '+(blob.size/1048576).toFixed(2)+' MB'+(blob.type.startsWith('image/')?' ('+t('اضغط للفتح','tap pour ouvrir')+')':' ('+t('اضغط للتنزيل','tap pour télécharger')+')');if(blob.type.startsWith('image/'))a.target='_blank';document.getElementById('files').appendChild(a);log('✅ '+t('تم الاستلام: ','Reçu : ')+cur.name);cur=null}else if(msg.type==='done'){log('🎉 '+t('وصلت جميع الملفات!','Tous les fichiers reçus !'));try{conn.send({type:'complete'})}catch{}setStatus('🟢 '+t('اكتمل الاستلام ✅','Terminé ✅'))}});conn.on('error',e=>log('❌ '+e))});peer.on('error',e=>log('❌ '+e.type+' ('+t('رمز غير صالح؟','code inconnu ?')+')'))}
document.getElementById('btnReceiver').onclick=()=>{const c=document.getElementById('codeInput').value.trim();if(!c){log('⚠️ '+t('أدخل الرمز','Entre le code'));return}connectRecv(c)};
</script>
</body>
</html>
