<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;transition:box-shadow .2s}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#312e81 0%,#0f172a 45%,#020617 100%);color:#e2e8f0;padding:0 16px 60px;display:flex;flex-direction:column;align-items:center}
/* ===== Navbar ===== */
#navbar{position:sticky;top:0;z-index:100;width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;margin:0 -16px 26px;background:rgba(15,23,42,.78);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid rgba(148,163,184,.18);box-shadow:0 10px 30px -14px rgba(2,6,23,.9)}
#navbar::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,#818cf8,#a78bfa,#38bdf8,transparent);opacity:.85}
#navbar .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#e2e8f0;font-weight:800;font-size:18px}
#navbar .logo-mark{display:grid;place-items:center;width:34px;height:34px;transition:transform .25s}
#navbar .logo-mark img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(56,189,248,.4))}
#navbar .logo:hover .logo-mark{transform:translateY(-1px) rotate(-6deg)}
#navbar .logo b{color:#a5b4fc}
#navbar .tabs{display:flex;gap:6px}
#navbar .tabs a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#a5b4fc;padding:9px 15px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
#navbar .tabs a:hover{background:rgba(129,140,248,.15);color:#e2e8f0;transform:translateY(-1px)}
#navbar .tabs a.active{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#0f172a;box-shadow:0 8px 22px rgba(129,140,248,.42)}
#navbar .actions{display:flex;align-items:center;gap:8px}
#navbar .actions button{width:38px;height:38px;border-radius:50%;padding:0;margin:0;font-size:16px;display:grid;place-items:center}
#navbar .langpill{width:auto !important;height:auto !important;display:inline-block}
#navbar #menuBtn{display:none;position:relative;background:transparent;color:#c7d2fe;border:1px solid rgba(129,140,248,.5);cursor:pointer}
#navbar #menuBtn:hover{background:rgba(129,140,248,.15);transform:translateY(-1px)}
#navbar #menuBtn .bars{position:relative;width:18px;height:12px;display:block}
#navbar #menuBtn .bars span{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;transition:transform .3s,opacity .2s,top .3s}
#navbar #menuBtn .bars span:nth-child(1){top:0}
#navbar #menuBtn .bars span:nth-child(2){top:5px}
#navbar #menuBtn .bars span:nth-child(3){top:10px}
#navbar.open #menuBtn .bars span:nth-child(1){top:5px;transform:rotate(45deg)}
#navbar.open #menuBtn .bars span:nth-child(2){opacity:0}
#navbar.open #menuBtn .bars span:nth-child(3){top:5px;transform:rotate(-45deg)}
#navBackdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;z-index:98}
#navBackdrop.open{opacity:1;visibility:visible}
@media (max-width:760px){
  #navbar{padding:10px 14px;margin:0 -8px 18px}
  #navbar #menuBtn{display:grid}
  #navbar .tabs{position:fixed;top:var(--nav-h,60px);left:0;right:0;flex-direction:column;gap:8px;padding:0 14px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;background:rgba(15,23,42,.98);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);z-index:99;transition:max-height .38s cubic-bezier(.22,1,.36,1),padding .38s cubic-bezier(.22,1,.36,1),opacity .25s ease}
  #navbar .tabs.open{max-height:72vh;padding:14px;opacity:1;pointer-events:auto;border-radius:0 0 20px 20px;box-shadow:0 28px 50px -26px #000}
  #navbar .tabs a{padding:14px;text-align:center;justify-content:center;font-size:15px;background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.12)}
  #navbar .tabs a.active{background:linear-gradient(135deg,#818cf8,#a78bfa);border-color:transparent}
  #navbar .tabs a:active{transform:scale(.98)}
  body{padding:0 8px 50px}
  .card{padding:18px}
  button{padding:13px 18px;font-size:15px}
}
/* ===== /Navbar ===== */
.card{background:rgba(30,41,59,.6);backdrop-filter:blur(10px);border:1px solid rgba(148,163,184,.2);border-radius:20px;padding:26px;width:100%;max-width:640px;margin-bottom:18px}
.card h2{color:#c4b5fd;font-size:16px;margin-bottom:14px;text-transform:uppercase;letter-spacing:3px}
button{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#0f172a;font-weight:800;border:none;padding:11px 20px;border-radius:11px;cursor:pointer;font-size:14px;margin:4px 2px}
button.ghost{background:transparent;color:#a5b4fc;border:1px solid #6366f1}
.langpill{background:linear-gradient(135deg,#38bdf8,#818cf8,#a78bfa);color:#0f172a;font-weight:800;padding:8px 14px !important;border-radius:999px;border:none;box-shadow:0 4px 14px rgba(129,140,248,.5);font-size:12px;cursor:pointer}
input[type=text],input[type=password]{padding:11px 14px;border-radius:11px;border:1px solid #4f46e5;background:rgba(0,0,0,.3);color:#fff;width:100%;max-width:240px;font-size:16px}
.speed{font-family:Consolas,monospace;color:#c4b5fd;margin-top:8px;font-size:14px;direction:ltr}
progress{width:100%;height:12px;border-radius:6px;margin-top:12px;accent-color:#8b5cf6}
.box{background:rgba(0,0,0,.3);border-radius:12px;padding:12px 14px;min-height:56px;max-height:170px;overflow-y:auto;font-size:13px;white-space:pre-wrap;margin:10px 0;color:#c7d2fe;scrollbar-width:thin;scrollbar-color:#818cf8 rgba(0,0,0,.2)}
#files a{display:block;color:#c4b5fd;background:rgba(0,0,0,.3);padding:9px 12px;border-radius:9px;margin-top:6px;text-decoration:none}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:14px}
#gallery:empty{display:none}
#gallery h3{grid-column:1/-1;color:#c4b5fd;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin:0}
.gitem{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid rgba(148,163,184,.25);background:rgba(0,0,0,.3)}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .25s}
.gitem:hover img{transform:scale(1.06)}
.gitem .gdl{position:absolute;inset-inline-end:6px;bottom:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(15,23,42,.85);color:#a5b4fc;text-decoration:none;font-size:14px;border:1px solid rgba(148,163,184,.3);margin:0;padding:0}
.gitem .gdl:hover{background:#818cf8;color:#0f172a;transform:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header{text-align:center;margin-bottom:24px}
header h1{font-size:36px;font-weight:800}
header h1 b{color:#a5b4fc}
header p{color:#94a3b8;margin-top:8px}
/* ===== Modern polish ===== */
html{scroll-behavior:smooth}
::selection{background:#6366f1;color:#fff}
:focus-visible{outline:2px solid #818cf8;outline-offset:2px}
button:not(:disabled):active{transform:scale(.97)}
input:focus,textarea:focus{outline:2px solid #818cf8;outline-offset:1px;border-color:#818cf8}
.card{transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .55s cubic-bezier(.22,1,.36,1) both;background-image:linear-gradient(180deg,rgba(148,163,184,.06),transparent 42%)}
.card:hover{border-color:rgba(129,140,248,.4)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
body.nav-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}html{scroll-behavior:auto}}
</style>
</head>

<script>(function(){var nav=document.getElementById('navbar');if(!nav)return;var menu=document.getElementById('navTabs'),btn=document.getElementById('menuBtn'),bd=document.getElementById('navBackdrop');function setH(){document.documentElement.style.setProperty('--nav-h',nav.offsetHeight+'px')}function set(o){nav.classList.toggle('open',o);menu.classList.toggle('open',o);if(bd)bd.classList.toggle('open',o);document.body.classList.toggle('nav-open',o);if(btn)btn.setAttribute('aria-expanded',o?'true':'false')}if(btn)btn.addEventListener('click',function(e){e.preventDefault();set(!menu.classList.contains('open'))});if(menu)menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){set(false)})});if(bd)bd.addEventListener('click',function(){set(false)});document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});window.addEventListener('resize',function(){setH();if(window.innerWidth>760)set(false)},{passive:true});window.addEventListener('load',setH);setH()})();</script>
<header>
  <h1 data-ar="استقبال الملفات" data-fr="Recevoir" data-en="Receive">📥 استقبال الملفات</h1>
  <p data-ar="أدخل الرمز الذي أعطاك إياه المُرسِل." data-fr="Saisis le code donné par l'expéditeur." data-en="Enter the code given by the sender.">أدخل الرمز الذي أعطاك إياه المُرسِل.</p>
</header>
<div id="statusConn" class="box" style="text-align:center;max-width:300px;margin-bottom:18px" data-ar="🔴 غير متصل" data-fr="🔴 Hors ligne" data-en="🔴 Offline">🔴 غير متصل</div>
<div class="card">
  <div class="row">
    <input type="text" id="codeInput" data-ar="الرمز المستلَم" data-fr="Code reçu" data-en="Code received" placeholder="الرمز المستلَم">

<div class="card">
  <h2 data-ar="📋 السجل التقني" data-fr="📋 Journal technique" data-en="📋 Technical log">📋 السجل التقني</h2>
  <div id="log" class="box" style="max-height:220px;min-height:90px"></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let LANG=(typeof localStorage!=='undefined'&&localStorage.getItem('sg_lang'))||'ar'; const EN_FR={"Envoyer":"Send","Recevoir":"Receive","Chat":"Chat","Dossiers, images, ZIP, RAR… entre 2 appareils — sans serveur.":"Folders, images, ZIP, RAR… between 2 devices — no server.","📱 Fonctionne sur PC ou téléphone — PC ↔ PC, PC ↔ téléphone, téléphone ↔ PC.":"📱 Works on PC or phone — PC ↔ PC, PC ↔ phone, phone ↔ PC.","🔴 Hors ligne":"🔴 Offline","1 · Envoyer":"1 · Send","✨ Créer un code":"✨ Create a code","Mot de passe (optionnel)":"Password (optional)","📋 Copier":"📋 Copy","🔗 Lien":"🔗 Link","Fichiers (clique ou glisse):":"Files (click or drag):","📂 Clique ou glisse des fichiers/photos ici":"📂 Click or drop files/photos here","📁 Dossier":"📁 Folder","📄 Fichiers":"📄 Files","📷 Photos":"📷 Photos","📤 Envoyer les fichiers":"📤 Send files","🕓 Historique":"🕓 History","🗑️ Vider l'historique":"🗑️ Clear history","📋 Journal technique":"📋 Technical log","Saisis le code donné par l'expéditeur.":"Enter the code given by the sender.","Code reçu":"Code received","🔗 Connecter":"🔗 Connect","Mot de passe":"Password","Chat chiffré":"Encrypted chat","Un code spécial — seule la personne qui a le code peut lire les messages et photos.":"A code — only the person with the code can read messages and photos.","✨ Créer un code de chat":"✨ Create a chat code","Donne ce code à la personne pour qu'elle rejoigne.":"Give this code to the person to join.","Code de chat":"Chat code","🔗 Rejoindre":"🔗 Join","🔒 Les messages sont chiffrés (AES-GCM) et non sauvegardés.":"🔒 Messages are encrypted (AES-GCM) and not saved.","Message…":"Message…","1 · إرسال الملفات":"1 · Send files","2 · استقبال":"2 · Receive","ساعة السجل":"History","تم الاستلام: ":"Received: ","تم إرسال: ":"Sent: "};const t=(a,f)=>LANG==='ar'?a:(LANG==='fr'?f:(EN_FR[f]||f));
const log=m=>document.getElementById('log').textContent+=m+"\n";
function applyLang(l){LANG=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.title=l==='ar'?'Send Your File — استقبال':'Send Your File — Recevoir';document.querySelectorAll('[data-ar]').forEach(el=>{const v=l==='en'?(el.dataset.en||el.dataset.fr):el.dataset[l];if(!v)return;if(el.placeholder!==undefined&&el.tagName==='INPUT')el.placeholder=v;else el.textContent=v;});document.getElementById('langBtn').textContent=l==='ar'?'🌐 العربية':(l==='fr'?'🌐 Français':'🌐 English');try{localStorage.setItem('sg_lang',l)}catch(e){}}
document.getElementById('langBtn').onclick=()=>applyLang(LANG==='ar'?'fr':(LANG==='fr'?'en':'ar'));const setStatus=x=>document.getElementById('statusConn').textContent=x;
const fmtDur=s=>s>=3600?Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m':(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s');
function startPing(conn){const s=()=>{try{conn.send({type:'ping',t:Date.now()})}catch{}};s();const iv=setInterval(s,3000);conn.on('data',m=>{if(m.type==='ping')conn.send({type:'pong',t:m.t});else if(m.type==='pong')setStatus('🟢 '+t('متصل','Connecté')+' — '+(Date.now()-m.t)+' ms')});conn.on('close',()=>{clearInterval(iv);setStatus('🔴 '+t('غير متصل','Hors ligne'))})}
const urlCode=new URLSearchParams(location.search).get('code');
if(urlCode){document.getElementById('codeInput').value=urlCode;setTimeout(()=>connectRecv(urlCode),800)}
let recvConn=null;
function connectRecv(code){const peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:numb.viagenie.ca',username:'webrtc@live.com',credential:'muazkh'},{urls:'turn:numb.viagenie.ca:443?transport=tcp',username:'webrtc@live.com',credential:'muazkh'}]}});let cur=null,last=0,lastT=Date.now();document.getElementById('recvSpeed').classList.remove('hidden');peer.on('open',()=>{const conn=peer.connect(code,{serialization:'binary'});recvConn=conn;let gotFirst=false;conn.on('open',()=>{setStatus('🟡 '+t('جارٍ الاتصال…','En connexion…'));log('🔗 '+t('متصل بالرمز ','Connecté à ')+code);startPing(conn);const iv=setInterval(()=>{if(!gotFirst)conn.send({type:'ready',pass:document.getElementById('passRecv').value||''});},800);conn.send({type:'ready',pass:document.getElementById('passRecv').value||''});lastT=Date.now();window._stopReady=()=>{gotFirst=true;clearInterval(iv)}});conn.on('data',async msg=>{if(msg.type==='meta'){cur={name:msg.name,size:msg.size||0,parts:[],mime:msg.mime||''};log('📥 '+msg.name);last=0;document.getElementById('progRecv').classList.remove('hidden');document.getElementById('progRecv').value=0;if(window._stopReady)window._stopReady()}else if(msg.type==='chunk'&&cur){cur.parts.push(msg.data);const now=Date.now();const got=cur.parts.reduce((s,p)=>s+p.byteLength,0);if(now-lastT>500){const v=(got-last)/((now-lastT)/1000);document.getElementById('progRecv').classList.remove('hidden');document.getElementById('progRecv').value=cur.size?got/cur.size*100:0;document.getElementById('recvSpeed').textContent='⚡ '+(v/1048576).toFixed(2)+' MB/s'+(cur.size?' · '+(got/cur.size*100).toFixed(1)+' %':'')+' · '+t('متبقّي ~','~')+fmtDur(v>0&&cur.size?Math.ceil((cur.size-got)/v):0);last=got;lastT=now}}else if(msg.type==='fileend'&&cur){const blob=new Blob(cur.parts,{type:cur.mime});const url=URL.createObjectURL(blob);const fname=cur.name.split('/').pop();const isImg=blob.type.startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp|svg|avif|heic|heif)$/i.test(fname);if(isImg){addToGallery(fname,url,blob.size)}else{const a=document.createElement('a');a.href=url;a.download=fname;a.textContent='📥 '+cur.name+' — '+(blob.size/1048576).toFixed(2)+' MB ('+t('اضغط للتنزيل','tap pour télécharger')+')';document.getElementById('files').appendChild(a)}log('✅ '+t('تم الاستلام: ','Reçu : ')+cur.name);cur=null}else if(msg.type==='done'){log('🎉 '+t('وصلت جميع الملفات!','Tous les fichiers reçus !'));try{conn.send({type:'complete'})}catch{}setStatus('🟢 '+t('اكتمل الاستلام ✅','Terminé ✅'))}});conn.on('error',e=>log('❌ '+e))});peer.on('error',e=>log('❌ '+e.type+' ('+t('رمز غير صالح؟','code inconnu ?')+')'))}
function addToGallery(name,url,size){const g=document.getElementById('gallery');if(!g.querySelector('h3')){const h=document.createElement('h3');h.textContent='🖼️ '+t('الصور المستلَمة','Images reçues');g.appendChild(h)}const it=document.createElement('div');it.className='gitem';const img=document.createElement('img');img.src=url;img.alt=name;img.title=name+' — '+(size/1048576).toFixed(2)+' MB · '+t('اضغط للتكبير','clique pour agrandir');img.onclick=()=>window.open(url,'_blank');const dl=document.createElement('a');dl.className='gdl';dl.href=url;dl.download=name;dl.textContent='⬇';dl.title=t('تنزيل','Télécharger');dl.onclick=e=>e.stopPropagation();it.appendChild(img);it.appendChild(dl);g.appendChild(it)}
document.getElementById('btnReceiver').onclick=()=>{const c=document.getElementById('codeInput').value.trim();if(!c){log('⚠️ '+t('أدخل الرمز','Entre le code'));return}connectRecv(c)};
applyLang(LANG);
</script>
